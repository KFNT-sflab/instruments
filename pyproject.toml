[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sflab-instruments"
version = "0.1.0"
description = "Python drivers and control interfaces for laboratory measurement instruments"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Superfluid Lab"}
]
keywords = [
    "physics",
    "laboratory",
    "instruments",
    "pyvisa",
    "lockin",
    "vna",
    "data-acquisition",
    "measurement"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pyvisa",
    "pyserial",
    "lmfit",
    "tqdm",
    "ilock",
    "nidaqmx>=1.6.0",
]

[project.optional-dependencies]
daq = ["nidaqmx"]
zhinst = ["zhinst"]
all = ["nidaqmx", "zhinst"]

[project.urls]
Homepage = "https://github.com/KFNT-sflab/instruments"
Repository = "https://github.com/KFNT-sflab/instruments"

[tool.setuptools.packages.find]
where = ["src"]
