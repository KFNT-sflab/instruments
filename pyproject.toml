[project]
name = "sflab-instruments"
version = "0.0.1"
description = "Python drivers and control interfaces for laboratory measurement instruments"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICEN[CS]E*"]
authors = [
    {name = "Emil Varga", email="varga.emil@gmail.com"},
    {name = "Marek Talíř"},
    {name = "Balázs Szalai"},
    {name = "Filip Novotný"}
]
keywords = [
    "physics",
    "instruments",
    "pyvisa",
    "data-acquisition",
    "measurement"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3"
]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pyvisa",
    "pyserial",
    "lmfit",
    "tqdm",
    "ilock",
    "nidaqmx>=1.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
daq = ["nidaqmx"]
zhinst = ["zhinst"]
all = ["nidaqmx", "zhinst"]

[project.scripts]
sflab_instrument_server = "sflab_instruments.InstrumentServer:main"

[project.urls]
Homepage = "https://github.com/KFNT-sflab/instruments"
Repository = "https://github.com/KFNT-sflab/instruments"
